name: Daily summary (EOD)

# Triggered by cron-job.org at 16:20 ET on weekdays (workflow_dispatch). Replays today's
# Trend-join Long alerts with their frozen trade plans, updates history/trades.csv and sends a
# silent Telegram summary with all-time stats. Skips weekends/NYSE holidays automatically.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Score a past date instead of today (YYYY-MM-DD, optional)"
        required: false
        default: ""

concurrency:
  group: eod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Score today's alerts and send summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python run_cycle.py --eod --date "${{ inputs.date }}"
          else
            python run_cycle.py --eod
          fi
      - name: Save trade history
        if: always()
        run: |
          [ -d history ] || exit 0
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add history
          git diff --cached --quiet && exit 0
          git commit -m "Daily summary $(TZ=America/New_York date '+%F')"
          git pull --rebase --autostash
          git push
