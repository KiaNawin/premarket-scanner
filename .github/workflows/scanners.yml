name: Scanners → Telegram

# Fires every 30 min between 12:00 and 19:30 UTC on weekdays. run_cycle.py --once converts to
# New York time and only runs when the time falls in a scheduled slot, so the schedule stays
# correct through US daylight-saving changes and skips NYSE holidays:
#   Scanner A 08:30–14:00 ET every 30 min · Scanner B 5 min after each, last at 14:35 ET
#   → one Telegram message per cycle.
# Note: GitHub may start scheduled jobs a few minutes late. For exact timing use
# `python run_cycle.py --loop` on an always-on computer/VPS instead.

on:
  schedule:
    - cron: "0,30 12-19 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a slot now, e.g. 10:00 (blank = use current time)"
        required: false
        default: ""

concurrency:
  group: scanners
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanners and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}   # optional
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            python run_cycle.py --slot "${{ inputs.slot }}"
          else
            python run_cycle.py --once
          fi
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add scans/ signals/ watchlists/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Scan results $(TZ=America/New_York date '+%F %H:%M ET')"
          git pull --rebase && git push
