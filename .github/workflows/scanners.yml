name: Scanners → Telegram

# Triggers twice per 30-min slot, a few minutes past :00/:30 (GitHub often delays or drops
# jobs scheduled exactly on the hour/half-hour). run_cycle.py --once converts to New York time,
# runs the slot that matches, and skips if that slot was already done (state/last_slot.txt),
# so the second trigger is a safety net and never sends a duplicate message.
#   Scanner A 08:30–14:00 ET every 30 min · Scanner B right after (5 min after slot start)
#   Handles US daylight saving and NYSE holidays automatically.
# Tip: an external trigger (e.g. cron-job.org → workflow_dispatch) gives exact timing.

on:
  schedule:
    - cron: "3,13,33,43 12-19 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a slot now, e.g. 10:00 (blank = use current time)"
        required: false
        default: ""

concurrency:
  group: scanners
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanners and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}   # optional
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            python run_cycle.py --slot "${{ inputs.slot }}"
          else
            python run_cycle.py --once
          fi
      - name: Save results to the repo
        if: always()
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          # add only folders that exist (one missing folder would make `git add` skip everything)
          for d in scans signals watchlists state debug; do
            if [ -e "$d" ]; then git add "$d"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "Scan results $(TZ=America/New_York date '+%F %H:%M ET')"
          git pull --rebase -X theirs || git pull --rebase
          git push
