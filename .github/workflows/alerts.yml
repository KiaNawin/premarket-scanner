name: Trend-join Long alerts

# Fast Scanner B check, triggered every 5 min by cron-job.org (workflow_dispatch) between
# 10:00 and 11:30 ET. Re-checks today's Scanner A gappers and sends a Telegram alert (with
# sound) ONLY for entries that are new today. Silent when nothing new. Outside the window the
# run exits immediately. Runs in its own concurrency group so it never cancels the 30-min report.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside 10:00–11:30 ET (testing)"
        type: boolean
        default: false

concurrency:
  group: alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for new Trend-join Long entries
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_DUMP: "0"
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python run_cycle.py --alert --force
          else
            python run_cycle.py --alert
          fi
      - name: Remember what was alerted
        if: always()
        run: |
          [ -d state ] || exit 0
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -m "Alerts $(TZ=America/New_York date '+%F %H:%M ET')"
          git pull --rebase || { git rebase --abort; git pull --no-rebase --no-edit; }
          git push
